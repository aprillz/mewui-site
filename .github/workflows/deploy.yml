name: Deploy site

on:
  push:
    branches: [main]
  # Stars, downloads and the published version are read at build time, so a
  # daily rebuild keeps them current without a commit. 06:17 KST.
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PUBLIC_SITE_URL: https://mewui.aprillz.net
  PUBLIC_SITE_BASE: /
  PUBLIC_COUNT_URL: https://mewui-site-counter.aprillz.workers.dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24: the documentation site (Astro 7) needs 22.23.4 or newer, which the runner's 22 is not.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The documentation site is built from the MewUI repository itself (guides, markup reference
      # and the core API reference) and served under /docs. The ref moves to main once the docs
      # tooling ships there.
      - name: Checkout MewUI
        uses: actions/checkout@v4
        with:
          repository: aprillz/MewUI
          ref: dev
          path: upstream

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Every C# example on the page comes from here, compiled against the
      # package version the page advertises.
      - name: Verify the code examples compile
        run: dotnet build snippets/Snippets.csproj -c Release

      - name: Build the documentation site
        run: scripts/build-docs.sh upstream /docs "$PUBLIC_SITE_URL"

      - name: Add the documentation to the site
        run: |
          mkdir -p dist/docs
          cp -R upstream/website/dist/. dist/docs/
          test -f dist/docs/index.html
          test -f dist/docs/api/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
